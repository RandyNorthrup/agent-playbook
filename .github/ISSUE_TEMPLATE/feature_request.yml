name: Feature request
description: An idea for the engine, the canvas, a QC filter type or a helper script
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you'd like it to work. Sketches of commands or flows welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
