name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands or canvas actions, in order. Use the demo playbook if you can.
      placeholder: |
        1. python playbook/pb.py ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: Paste the exact output. Remove any handles, links or text you don't want public.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, Chrome 131
    validations:
      required: true
