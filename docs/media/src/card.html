<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Playbook social preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; padding: 0; background: #0E1318; }
  .c {
    position: relative; width: 1280px; height: 640px; overflow: hidden;
    background: #0E1318 url("key-art.png") no-repeat;
    background-size: 1400px auto; background-position: 340px 50%;
    font-family: "Schibsted Grotesk", system-ui, sans-serif; color: #E6EBF1;
  }
  .c::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, #0E1318 0%, rgba(14,19,24,.92) 38%, rgba(14,19,24,.55) 60%, rgba(14,19,24,.35) 100%);
  }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .mark {
    width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center;
    background: #252E50; border: 1.5px solid #3A4A86; margin-bottom: 28px; box-shadow: 0 0 40px rgba(130,151,255,.35);
  }
  .mark svg { width: 36px; height: 36px; stroke: #8297FF; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0; font-size: 72px; line-height: 1; font-weight: 800; letter-spacing: -2px; }
  .tag { margin: 22px 0 0; font-size: 26px; line-height: 1.35; font-weight: 500; color: #B3BECB; }
  .tag b { color: #E6EBF1; font-weight: 700; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .pill {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 15px; color: #B3BECB;
    padding: 7px 14px; border-radius: 999px; border: 1.5px solid #2A3340; background: rgba(25,32,42,.9);
  }
  .pill i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 0; }
  .shot {
    position: absolute; left: 660px; top: 96px; width: 700px; border-radius: 14px; overflow: hidden;
    border: 1.5px solid #3A4555; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(130,151,255,.15), 0 0 90px rgba(130,151,255,.18);
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="c">
  <div class="text">
    <div class="mark"><svg viewBox="0 0 24 24"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></svg></div>
    <h1>Agent Playbook</h1>
    <p class="tag">Step-by-step flows your coding agent follows. <b>You edit them on a canvas.</b></p>
    <div class="pills">
      <span class="pill"><i style="background:#25915F"></i>visual canvas</span>
      <span class="pill"><i style="background:#13879A"></i>QC gate</span>
      <span class="pill"><i style="background:#B03F78"></i>audit log</span>
      <span class="pill"><i style="background:#7E4FCF"></i>stdlib Python</span>
    </div>
  </div>
  <div class="shot"><img src="card-shot.png" alt=""></div>
</div>
</body>
</html>
