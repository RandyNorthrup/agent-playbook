<!DOCTYPE html>
<section class="top-card-layout container-lined overflow-hidden babybear:rounded-[0px]">
  <div class="top-card-layout__entity-info-container flex flex-wrap papabear:flex-nowrap">
    <h2 class="top-card-layout__title font-sans text-lg papabear:text-xl font-bold leading-open text-color-text mb-0 topcard__title">Web Developer (React &amp; Node)</h2>
    <h4 class="top-card-layout__second-subline font-sans text-sm leading-open text-color-text-low-emphasis mt-0.5">
      <div class="topcard__flavor-row">
        <span class="topcard__flavor">
          <a class="topcard__org-name-link topcard__flavor--black-link" data-tracking-control-name="public_jobs_topcard-org-name" href="https://www.linkedin.com/company/example-labs">
            Example Labs
          </a>
        </span>
        <span class="topcard__flavor topcard__flavor--bullet">
          United States
        </span>
      </div>
      <div class="topcard__flavor-row">
        <span class="posted-time-ago__text topcard__flavor--metadata">1 day ago</span>
        <figcaption class="num-applicants__caption">
          Over 200 applicants
        </figcaption>
      </div>
    </h4>
  </div>
</section>
<div class="description__text description__text--rich">
  <section class="show-more-less-html" data-max-lines="5">
    <div class="show-more-less-html__markup show-more-less-html__markup--clamp-after-5
        relative overflow-hidden">
      <p>We&#39;re hiring a <strong>fully remote</strong> web developer.</p><ul><li>React &amp; Node</li><li>3+ years</li></ul>
    </div>
  </section>
</div>
<ul class="description__job-criteria-list">
  <li class="description__job-criteria-item">
    <h3 class="description__job-criteria-subheader">
      Seniority level
    </h3>
    <span class="description__job-criteria-text description__job-criteria-text--criteria">
      Mid-Senior level
    </span>
  </li>
  <li class="description__job-criteria-item">
    <h3 class="description__job-criteria-subheader">
      Employment type
    </h3>
    <span class="description__job-criteria-text description__job-criteria-text--criteria">
      Contract
    </span>
  </li>
</ul>
