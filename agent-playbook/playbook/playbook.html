<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body><title>Agent Playbook</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a drafting table. Index rail on the left, a wide pannable board in the middle, a slide-in inspector on the right. */
:root{
  --bg:#E8ECF1; --board:#F4F6F9; --dot:#CBD3DD; --panel:#FFFFFF; --panel-2:#F3F5F8;
  --ink:#16202B; --ink-2:#465364; --muted:#657181; --line:#DCE2E9; --line-2:#C5CED9;
  --accent:#3B57D9; --accent-ink:#FFFFFF; --accent-soft:#E4E9FF; --wire:#97A3B3; --scrim:rgba(18,24,33,.38);
  --shadow:0 1px 2px rgba(20,30,45,.06),0 6px 18px rgba(20,30,45,.07);
  /* light-theme text colours keep 4.5:1 on the panels (small labels use them) */
  --k-start:#207F53; --k-step:#3864D2; --k-decision:#A0610B; --k-check:#117B8C; --k-rule:#CA3D38;
  --k-tool:#7E4FCF; --k-gotcha:#8A6C0F; --k-output:#B03F78; --k-goto:#5B6B80; --k-account:#B6511D;
  --ok:#1E754C; --warn:#8C6109; --bad:#CA3D38;
  --f-ui:"Schibsted Grotesk",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1318; --board:#131921; --dot:#263140; --panel:#19202A; --panel-2:#212A36;
  --ink:#E6EBF1; --ink-2:#B3BECB; --muted:#8592A3; --line:#2A3340; --line-2:#3A4555;
  --accent:#8297FF; --accent-ink:#0E1318; --accent-soft:#252E50; --wire:#5E6B7D; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28);
  --k-start:#45C189; --k-step:#7298FF; --k-decision:#F0A63E; --k-check:#3BBCCB; --k-rule:#F06C66;
  --k-tool:#AE88F7; --k-gotcha:#DDB63C; --k-output:#E46CA6; --k-goto:#8E9BAF; --k-account:#FF8C50;
  --ok:#45C189; --warn:#F0A63E; --bad:#F06C66; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1318; --board:#131921; --dot:#263140; --panel:#19202A; --panel-2:#212A36;
  --ink:#E6EBF1; --ink-2:#B3BECB; --muted:#8592A3; --line:#2A3340; --line-2:#3A4555;
  --accent:#8297FF; --accent-ink:#0E1318; --accent-soft:#252E50; --wire:#5E6B7D; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28);
  --k-start:#45C189; --k-step:#7298FF; --k-decision:#F0A63E; --k-check:#3BBCCB; --k-rule:#F06C66;
  --k-tool:#AE88F7; --k-gotcha:#DDB63C; --k-output:#E46CA6; --k-goto:#8E9BAF; --k-account:#FF8C50;
  --ok:#45C189; --warn:#F0A63E; --bad:#F06C66; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
code{font-family:var(--f-mono);font-size:.92em}
.i{flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.shell{height:100%;display:grid;grid-template-columns:272px minmax(0,1fr) auto;gap:12px}
.rail,.stage,.insp{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:0;overflow:hidden}
.rail{display:flex;flex-direction:column}
.stage{display:flex;flex-direction:column;min-width:0;container:stage/inline-size}
.insp{width:372px;display:flex;flex-direction:column}

/* tones */
.k-start{--kc:var(--k-start)}.k-step{--kc:var(--k-step)}.k-decision{--kc:var(--k-decision)}.k-check{--kc:var(--k-check)}.k-rule{--kc:var(--k-rule)}
.k-tool{--kc:var(--k-tool)}.k-gotcha{--kc:var(--k-gotcha)}.k-output{--kc:var(--k-output)}.k-goto{--kc:var(--k-goto)}.k-account{--kc:var(--k-account)}
.tone-start{--tc:var(--k-start)}.tone-step{--tc:var(--k-step)}.tone-rule{--tc:var(--k-rule)}.tone-check{--tc:var(--k-check)}.tone-output{--tc:var(--k-output)}
.tone-tool{--tc:var(--k-tool)}.tone-account{--tc:var(--k-account)}.tone-goto{--tc:var(--k-goto)}.tone-decision{--tc:var(--k-decision)}
.ftile{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:color-mix(in srgb,var(--tc,var(--accent)) 14%,var(--panel));color:var(--tc,var(--accent));flex:none}
.gdot{width:8px;height:8px;border-radius:2px;background:var(--tc);flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;box-sizing:border-box}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{color:var(--bad)}
.btn.sm{height:28px;padding:0 9px;font-size:12px}
.btn.wide{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:default}
.ibtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink-2);cursor:pointer;text-decoration:none;flex:none;box-sizing:border-box}
.ibtn:hover{background:var(--panel-2);color:var(--ink)}
.ibtn.sm{width:26px;height:26px;border-radius:6px}
.only-m{display:none!important}

/* rail */
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.brand .ftile{--tc:var(--accent)}
.bname{font-weight:700;font-size:15px;letter-spacing:-.01em}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status[data-k=saved]::before,.status[data-k=live]::before{background:var(--ok)}
.status[data-k=saving]::before{background:var(--warn)}
.status[data-k=error]::before,.status[data-k=offline]::before{background:var(--bad)}
.tabs{display:flex;gap:2px;margin:0 12px;padding:3px;background:var(--panel-2);border-radius:9px}
.tabs a{flex:1 1 auto;text-align:center;padding:6px 2px;border-radius:7px;font-size:11.5px;font-weight:500;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{display:flex;align-items:center;gap:8px;margin:10px 12px 6px;padding:0 10px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--muted)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:100%;color:var(--ink)}
.search kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.results{margin:0 8px 6px;border:1px solid var(--line);border-radius:10px;max-height:46%;overflow:auto;background:var(--panel-2)}
.results button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:hover{background:var(--panel)}
.results .rt{font-size:13px;font-weight:500}
.results .rs{font-size:11.5px;color:var(--muted)}
.results .ic{color:var(--kc,var(--muted));margin-top:2px}
.flowlist{flex:1;min-height:0;overflow:auto;padding:4px 8px 8px}
.fgroup{margin-top:10px}
.gh{display:flex;align-items:center;gap:8px;font:600 10.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.gc{margin-left:auto;font-weight:500}
.fitem{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:13.5px}
.fitem:hover{background:var(--panel-2);color:var(--ink)}
.fitem.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.fitem .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .fc{font:500 11px var(--f-mono);color:var(--muted)}
.edot{width:7px;height:7px;border-radius:50%;background:var(--k-account);flex:none}
.railfoot{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px}
.empty{color:var(--muted);font-size:13px;padding:10px}

/* bar */
.bar{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line);min-height:58px;box-sizing:border-box}
.crumb{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.crumb .grp{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname{align-self:flex-start;border:0;background:transparent;padding:0;font-size:17px;font-weight:700;letter-spacing:-.01em;text-align:left;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fname:hover:not(:disabled){color:var(--accent)}
.fname:disabled{cursor:default}
.vt{font-size:17px}
.fsum{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
.tools .sepv{width:1px;height:22px;background:var(--line);margin:0 4px}
.banner{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 14px;font-size:13px;line-height:1.4;color:var(--ink);background:color-mix(in srgb,var(--warn) 13%,var(--panel));border-bottom:1px solid color-mix(in srgb,var(--warn) 35%,var(--line))}
.banner>.i{color:var(--warn)}
.banner>span{flex:1;min-width:0}

/* board */
.board{position:relative;flex:1;min-height:0;overflow:hidden;background-color:var(--board);background-image:radial-gradient(var(--dot) 1.15px,transparent 1.3px);touch-action:none;outline:0;user-select:none;-webkit-user-select:none}
.board.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.wires{position:absolute;left:-20000px;top:-20000px;width:40000px;height:40000px;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--wire);stroke-width:1.6}
.wire.att{stroke-dasharray:5 5;opacity:.8}
.wire.hot{stroke:var(--accent);stroke-width:2.1;opacity:1}
.wire.sel{stroke:var(--accent);stroke-width:2.8}
.wire.dim{opacity:.13}
.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.mk{fill:var(--wire)}.mkh{fill:var(--accent)}
#ghost{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4}
#nodes,#labels{position:absolute;left:0;top:0}
.elabel{position:absolute;transform:translate(-50%,-50%);font:500 11px/1.5 var(--f-mono);background:var(--board);color:var(--ink-2);padding:0 6px;border-radius:5px;border:1px solid var(--line);white-space:nowrap;cursor:pointer}
.elabel.sel{border-color:var(--accent);color:var(--accent)}
.node{position:absolute;width:252px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);cursor:grab;user-select:none;-webkit-user-select:none;transition:opacity .15s}
.node:hover{border-color:var(--line-2)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent),var(--shadow)}
.node.dim{opacity:.25}
.node.k-start{border-radius:22px}
.node.k-rule,.node.k-gotcha{background:color-mix(in srgb,var(--kc) 6%,var(--panel))}
.node.k-goto{border-style:dashed;border-color:var(--line-2);box-shadow:none}
.node .hd{display:flex;gap:10px;align-items:flex-start;padding:11px 12px 11px 11px}
.node .ic,.ihd .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc) 14%,transparent);color:var(--kc)}
.node .tx{min-width:0;flex:1}
.node .kl{font:600 9.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--kc);margin:2px 0 5px}
.node .t{font-weight:600;font-size:14px;line-height:1.25;letter-spacing:-.005em;overflow-wrap:anywhere}
.node .s{font-size:12px;line-height:1.35;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.node .ft{display:flex;gap:5px;flex-wrap:wrap;padding:0 12px 10px 51px;margin-top:-3px}
.node .edot{position:absolute;top:9px;right:9px}
.badge{display:inline-flex;align-items:center;gap:4px;font:500 10.5px/1 var(--f-mono);color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.badge.go{color:var(--k-goto)}
.port{position:absolute;top:50%;width:11px;height:11px;margin-top:-6.5px;border-radius:50%;background:var(--panel);border:2px solid var(--line-2);box-sizing:content-box}
.port.in{left:-7.5px;pointer-events:none}
.port.out{right:-7.5px;cursor:crosshair}
.node:hover .port.out,.port.out:hover{border-color:var(--accent);background:var(--accent-soft)}
#marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);pointer-events:none;border-radius:3px}
.boardui{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.boardui>*{pointer-events:auto}
.legend{display:flex;flex-wrap:wrap;gap:2px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:10px;padding:4px;max-width:min(560px,60%)}
.lk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 8px;border-radius:6px;border:0;background:transparent;cursor:pointer;color:var(--ink-2)}
.lk i{width:9px;height:9px;border-radius:3px;background:var(--kc)}
.lk:hover{background:var(--panel-2)}
.lk.on{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.lk b{font:500 10.5px var(--f-mono);color:var(--muted)}
.sp{flex:1}
.navbox{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.zoom{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.zoom span{font:500 11.5px var(--f-mono);min-width:44px;text-align:center;color:var(--ink-2)}
.mini{display:block;width:176px;height:116px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.boardmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.boardmsg h3{color:var(--ink);font-size:16px;margin:0 0 6px}
.boardmsg p{margin:0 auto;max-width:420px}

/* inspector */
.ihd{display:flex;align-items:center;gap:10px;padding:12px 10px 12px 14px;border-bottom:1px solid var(--line)}
.ihd .kl{font:600 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--kc)}
.ibody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 18px 20px}
.ibody>*{min-width:0;max-width:100%}
.frow,.fpath,.fmeta{min-width:0}
.ibody h2{font-size:19px;line-height:1.25;margin:0;letter-spacing:-.01em;text-wrap:balance}
.isub{color:var(--muted);margin:6px 0 0}
.ibody h3{font:600 10.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 9px}
.prose{margin-top:14px;color:var(--ink);font-size:13.5px;line-height:1.55}
.prose p{margin:0 0 8px}
.prose ul{margin:0 0 8px;padding-left:18px}
.prose li{margin:3px 0}
.prose li::marker{color:var(--kc,var(--muted))}
.prose code,.checks code,.anotes code{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;font-size:13px;line-height:1.45}
.checks .i{color:var(--ok);margin-top:2px}
.frow{border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 10px;margin-bottom:6px;background:var(--panel-2)}
.fmeta{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.fmeta .i{color:var(--k-tool)}
.fpath{display:flex;align-items:center;gap:2px;margin-top:5px}
.fpath code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;color:var(--ink-2)}
.links{display:grid;gap:4px}
.links a{display:flex;align-items:center;gap:7px;color:var(--accent);text-decoration:none;font-size:13px;overflow-wrap:anywhere}
.links a:hover{text-decoration:underline}
.conn{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:8px}
.conn>span{font-size:12px;color:var(--muted);width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 8px;cursor:pointer;color:var(--ink-2);text-decoration:none;max-width:100%}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip em{font-style:normal;font:500 10.5px var(--f-mono);color:var(--muted)}
.chip .x{margin-left:2px;cursor:pointer;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.srcs{display:flex;flex-wrap:wrap;gap:4px}
.srcs code{font-size:10.5px;color:var(--muted);background:var(--panel-2);border-radius:5px;padding:2px 6px}
.edited{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--k-account);margin-top:18px}
.ifoot{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.ifoot .danger{margin-left:auto}
.acct-inline{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);font-size:13px}

/* forms */
.fx{display:grid;gap:4px;margin-bottom:12px}
.fx>label,.fx>.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.fx .help{font-size:11.5px;color:var(--muted)}
.fx input[type=text],.fx input[type=url],.fx select,.fx textarea{width:100%;box-sizing:border-box;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:7px 9px;outline:0}
.fx textarea{resize:vertical;min-height:70px;line-height:1.45}
.fx textarea.mono{font:12.5px/1.5 var(--f-mono)}
.fx input:focus,.fx select:focus,.fx textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icongrid{display:flex;flex-wrap:wrap;gap:4px}
.icongrid label{cursor:pointer}
.icongrid input{position:absolute;opacity:0;pointer-events:none}
.icongrid span{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2)}
.icongrid input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.icongrid input:focus-visible+span{outline:2px solid var(--accent)}
.fadd{display:flex;gap:6px;margin-top:6px}
.fadd>*{flex:1;min-width:0}
/* the long step form keeps Save and Cancel in view */
#nodeForm .mact{position:sticky;bottom:-20px;z-index:1;margin:16px -18px -20px;padding:10px 18px;background:var(--panel);border-top:1px solid var(--line)}

/* pages */
.page{flex:1;min-height:0;overflow:auto;padding:26px clamp(16px,3vw,40px) 56px}
.hero h1{font-size:clamp(24px,3vw,32px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.hero p{color:var(--ink-2);max-width:66ch;margin:10px 0 0;font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:22px 0 8px}
.stat{background:var(--panel);padding:12px 14px}
.stat b{display:block;font:600 22px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.gsec{margin-top:30px}
.gsec h2{display:flex;align-items:center;gap:9px;font-size:15px;margin:0 0 12px;letter-spacing:-.005em}
.gsec h2 .gc{font:500 12px var(--f-mono);color:var(--muted);margin-left:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:13px 14px 12px;text-decoration:none;color:inherit;background:var(--panel);min-width:0}
.tile:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.tile .th{display:flex;align-items:center;gap:10px}
.tile .th b{font-size:14.5px}
.tile p{margin:0;color:var(--ink-2);font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.kbar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;background:var(--panel-2)}
.kbar i{background:var(--kc)}
.tm{font:500 11px var(--f-mono);color:var(--muted)}
.tm .you{color:var(--k-account)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 18px}
.toolbar select,.toolbar input{height:32px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 9px;min-width:0}
.toolbar input{flex:1;max-width:280px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.acard{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--panel);display:flex;flex-direction:column;gap:8px;min-width:0}
.acard header{display:flex;align-items:center;gap:10px}
.acard header>div{flex:1;min-width:0}
.ap{font:600 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ah{font:600 15px/1.3 var(--f-mono);overflow-wrap:anywhere}
.al{font-size:12.5px;color:var(--ink-2)}
.acard p{margin:0;font-size:13px;color:var(--ink)}
.arow{display:flex;gap:7px;font-size:12.5px;color:var(--ink-2)}
.arow .i{margin-top:2px;color:var(--muted)}
.anotes{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}
.acard footer{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:4px;border-top:1px solid var(--line)}
.acard.retired,.acard.skip{opacity:.7}
.pill{font:600 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--panel-2);color:var(--ink-2);flex:none}
.pill.s-active{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.s-replies-only{background:color-mix(in srgb,var(--k-step) 16%,transparent);color:var(--k-step)}
.pill.s-paused{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.s-skip,.pill.s-retired{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.ph{display:flex;align-items:center;gap:9px;margin:26px 0 10px;font-size:14px}
.ph:first-of-type{margin-top:6px}
.stats+.ph{margin-top:24px}
.ph .gc{font:500 12px var(--f-mono);color:var(--muted);margin-left:0}
.ph .btn{margin-left:auto}
.flist{display:grid;gap:8px}
.folder{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--panel)}
.folder .fl b{display:flex;align-items:center;gap:7px;font-size:13.5px}
.folder .fl b .i{color:var(--k-tool)}
.folder .fl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.folder .used{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.kindtag{font:600 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:3px 5px;margin-left:4px}
.pcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;min-width:0}
.pcard .hd{display:flex;gap:10px;padding:12px 12px 6px}
.pcard .hd .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc) 14%,transparent);color:var(--kc)}
.pcard .kl{font:600 9.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--kc);margin:2px 0 5px}
.pcard .hd>div{min-width:0}
.pcard .t{font-weight:600;overflow-wrap:anywhere}
.pcard .s{font-size:12px;color:var(--muted)}
/* margins, not padding: a clamped box shows the next line through its padding */
.pcard .bx{font-size:12.5px;line-height:1.45;color:var(--ink-2);margin:0 12px 10px 52px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pcard .bx code{font-size:.92em;color:var(--ink)}
.pcard .used{font-size:12px;color:var(--muted);padding:0 12px 10px 52px}
.pcard footer{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-top:1px solid var(--line);margin-top:auto}
.hrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);font-size:13px;flex-wrap:wrap}
.hrow .hat{font:500 11.5px var(--f-mono);color:var(--muted);min-width:118px}
.hrow .hwho{font-size:12px;color:var(--ink-2);min-width:70px}
.hrow .htitle{flex:1;min-width:0}
.hrow a{color:var(--accent);text-decoration:none}
.hrow .hwhy{flex-basis:100%;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.hrow .hwhy b{font-weight:600;color:var(--ink)}
.rchips{margin:-4px 0 4px}
.post{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.post.open{border-color:var(--line-2);box-shadow:var(--shadow)}
.phead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;cursor:pointer}
.phead:hover{background:var(--panel-2)}
.pmeta{flex:1;min-width:0;font-size:13px}
.pmeta small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{padding:4px 14px 14px 50px}
.ptext{white-space:pre-wrap;font:13.5px/1.55 var(--f-ui);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;overflow-wrap:anywhere}
.pdl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin:0}
.pdl dt{color:var(--muted)}
.pdl dd{margin:0;overflow-wrap:anywhere;min-width:0}
.pdl a{color:var(--accent)}
.notice{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:14px 16px;color:var(--ink-2);max-width:70ch}

/* modal, menus, toast */
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:60;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(580px,100%);max-height:86vh;overflow:auto;box-sizing:border-box;padding:20px}
.sheet h2{margin:0 0 14px;font-size:18px;letter-spacing:-.01em}
.sheet p{color:var(--ink-2);margin:0 0 14px}
.mact{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
.plist{display:grid;gap:6px;max-height:52vh;overflow:auto;margin-top:8px}
.plist button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 10px;cursor:pointer}
.plist button:hover{border-color:var(--accent)}
.plist .ic{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc) 14%,transparent);color:var(--kc)}
.plist b{display:block;font-size:13.5px}
.plist small{color:var(--muted);font-size:12px}
.menu{position:fixed;z-index:55;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.18);padding:6px;width:260px;max-height:70vh;overflow:auto}
.menu button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--panel-2)}
.menu .ic{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc,var(--accent)) 14%,transparent);color:var(--kc,var(--accent))}
.menu b{display:block;font-size:13px;font-weight:600}
.menu small{display:block;font-size:11.5px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--panel);border-radius:10px;padding:9px 14px;font-size:13px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:600;cursor:pointer;padding:0}
.kbd-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kbd-list kbd{font:500 11.5px var(--f-mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap;justify-self:start}
.scrim{display:none}

@media (max-width:1180px){.insp{width:330px}.shell{grid-template-columns:240px minmax(0,1fr) auto}.tabs{margin:0 8px}.tabs a{font-size:11px}}
/* the middle column narrows when the details panel opens (about 400px at 1024 wide): the top bar and the board
   controls give up their least needed parts first, so the flow's name stays readable and nothing is cut off */
@container stage (max-width:720px){.tools .lbl,.tools .sepv,.tools [data-act=shortcuts]{display:none}}
@container stage (max-width:480px){
  .hide-n,.mini{display:none!important}
  .legend{flex-wrap:nowrap;overflow-x:auto;max-width:calc(100% - 130px);scrollbar-width:none}
  .lk{white-space:nowrap}
}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:45;border-radius:0 14px 14px 0;transform:translateX(-104%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
  .shell.rail-open .rail{transform:none}
  .shell.rail-open .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:44}
  .insp{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:74vh;z-index:40;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  .only-m{display:inline-grid!important}
  .mini,.hide-m{display:none!important}
  .legend{flex-wrap:nowrap;overflow-x:auto;max-width:calc(100% - 150px);scrollbar-width:none}
  .lk{white-space:nowrap}
  .fsum{display:none}
  .folder{grid-template-columns:minmax(0,1fr)}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.partnote{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0;padding:8px 10px;border:1px dashed rgba(128,128,128,.4);border-radius:8px;font-size:12.5px;color:var(--muted)}
.partnote .pacts{display:flex;gap:6px;margin-left:auto}
.prov{margin-top:14px;font-size:12.5px;color:var(--muted)}
.prov summary{cursor:pointer;font:600 10.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase}
.prov .porigin{white-space:pre-wrap;margin:8px 0;line-height:1.45}
</style>

  'res-folder':() => go('folders'),
  'hist-tab':b => { S.hf.tab = b.dataset.tab; S.hf.open = null; pageHistory(); },
  'hist-open':b => { S.hf.open = S.hf.open === b.dataset.id ? null : b.dataset.id; const y = page.scrollTop; pageHistory().then(() => { page.scrollTop = y; }); },
  versions:b => versionsModal(b.dataset.col, b.dataset.id),
  'flow-history':() => versionsModal('flows', S.flowId),
  shortcuts:() => openModal(`<h2>Shortcuts</h2><div class="kbd-list"><kbd>Drag board</kbd><span>Move around</span><kbd>Wheel</kbd><span>Zoom</span><kbd>Shift + drag</kbd><span>Select a group</span><kbd>Shift + click</kbd><span>Add to selection</span><kbd>Drag a node’s right dot</kbd><span>Connect it (drop on empty space to add a new step)</span><kbd>Double-click</kbd><span>Edit a node, or add one on empty board</span><kbd>Enter</kbd><span>Edit the selected node</span><kbd>Ctrl + C / V</kbd><span>Copy and paste nodes, across flows too</span><kbd>Ctrl + D</kbd><span>Duplicate</span><kbd>Delete</kbd><span>Delete the selection</span><kbd>Ctrl + Z</kbd><span>Undo (Ctrl + Shift + Z to redo)</span><kbd>Ctrl + A</kbd><span>Select every node</span><kbd>F</kbd><span>Fit to screen (press again on a wide flow to see all of it)</span><kbd>+ / −</kbd><span>Zoom in and out</span><kbd>/</kbd><span>Search</span><kbd>Esc</kbd><span>Close and deselect</span></div><div class="mact"><span class="sp"></span><button class="btn primary" data-act="modal-close">Done</button></div>`)
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.tagName === 'A') e.preventDefault();
  fn(b, e);
  // a mouse click on a board or toolbar button hands focus back to the board: the next shortcut key then neither
  // lands on that button nor makes the browser draw a focus ring on it (keyboard use keeps focus where it is)
  if (e.detail > 0 && S.view === 'flow' && document.activeElement === b && b.closest('.boardui, .bar')) board.focus({preventScroll:true});
});
const textSelected = () => typeof getSelection === 'function' && String(getSelection() || '').trim() !== '';
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(); const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if (e.key === 'Escape') { if (!menu.hidden) { closeMenu(); return; } if (!modal.hidden) { closeModal(); return; } if (typing) { e.target.blur(); return; } if (S.editing) { S.editing = null; renderInspector(); return; } clearSel(); closeRail(); return; }
  if (typing || !modal.hidden || !menu.hidden) return;   // an open menu has its own keys (arrows, Enter on an item)
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('button,a,summary')) return;   // a focused control does its own thing
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === '/') { e.preventDefault(); openRail(); $('#q').focus(); return; }
  if (S.view !== 'flow') return;
  const k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'c') { if (S.sel.size && !textSelected()) { e.preventDefault(); copySel(); } return; }   // copying highlighted text still copies the text
  if (mod && k === 'v') { if (S.canWrite) { e.preventDefault(); pasteClip(); } return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && k === 'a') { e.preventDefault(); S.sel = new Set(curFlow().nodes.map(n => n.id)); S.selEdge = null; S.editing = null; refreshSel(); renderInspector(); return; }
  if (mod) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
  if (e.key === 'Enter' && S.sel.size === 1 && S.canWrite && S.editing) return;
  if (e.key === 'Enter' && S.sel.size === 1 && S.canWrite) { e.preventDefault(); ACT.edit(); return; }
  if (k === 'f') { fitKey(); return; }
  if (e.key === '+' || e.key === '=') { zoomCenter(1.2); return; }
  if (e.key === '-') { zoomCenter(1 / 1.2); return; }
});

boot();
})();
</script>
</body></html>
